<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#050510">
<meta name="description" content="Kozmik Tıklayıcı - Bağımlılık yapıcı uzay temalı idle clicker oyunu">
<title>Kozmik Tıklayıcı</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Exo+2:wght@400;500;600;700&display=swap');

  :root {
    --bg: #050510;
    --panel: #0a0a16;
    --accent: #00f0ff;
    --accent2: #ff2d95;
    --accent3: #a855f7;
    --text: #e8e8ff;
    --muted: #7a7a9a;
    --success: #00ff9d;
    --gold: #ffd700;
    --danger: #ff4466;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    user-select: none;
  }

  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--dur) ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

  .app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 360px;
    height: 100vh; height: 100dvh;
    max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(280px, 42vh); }
  }

  /* LEFT */
  .game-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; position: relative;
  }

  .stats-top { position: absolute; top: 16px; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; }
  .energy-display {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0,240,255,.35));
  }
  .cps-display { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  .cps-display span { color: var(--success); font-weight: 600; }

  .combo-bar {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    width: 180px; height: 6px; background: rgba(255,255,255,.08); border-radius: 4px;
    overflow: hidden; opacity: 0; transition: opacity .3s;
  }
  .combo-bar.active { opacity: 1; }
  .combo-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%; transition: width .1s linear; border-radius: 4px;
  }
  .combo-text {
    position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', monospace; font-size: .85rem; color: var(--gold);
    opacity: 0; transition: opacity .3s; white-space: nowrap;
  }
  .combo-text.active { opacity: 1; }

  .star-container {
    position: relative;
    width: min(260px, 55vw); height: min(260px, 55vw);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .main-star {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #00f0ff 18%, #0066ff 45%, #1a0033 100%);
    box-shadow: 0 0 40px #00f0ff, 0 0 80px #0066ff88, 0 0 120px #a855f755, inset 0 0 40px rgba(255,255,255,.25);
    transition: transform .07s ease, box-shadow .07s ease;
    position: relative; overflow: hidden;
  }
  .main-star::before {
    content: ''; position: absolute; inset: 14%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), transparent 65%);
  }
  .star-container:active .main-star,
  .star-container.clicked .main-star {
    transform: scale(.9);
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #0066ff;
  }
  .star-container.golden .main-star {
    background: radial-gradient(circle at 35% 35%, #fff 0%, #ffd700 20%, #ff8800 50%, #4a2000 100%);
    box-shadow: 0 0 50px #ffd700, 0 0 100px #ff8800aa, 0 0 150px #ff00aa55;
    animation: goldenPulse 1s ease-in-out infinite;
  }
  @keyframes goldenPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .click-hint {
    position: absolute; bottom: -36px; font-size: .8rem; color: var(--muted);
    opacity: .6; animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

  .float-text {
    position: absolute; font-family: 'Orbitron', monospace; font-weight: 700;
    font-size: 1.3rem; pointer-events: none;
    animation: floatUp .85s ease-out forwards; z-index: 30;
    text-shadow: 0 0 12px currentColor;
  }
  .float-text.crit { font-size: 1.7rem; color: var(--gold) !important; }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
  }

  /* Golden star notification */
  .golden-alert {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: linear-gradient(135deg, #ffd700, #ff8800);
    color: #1a1000; font-weight: 700; font-size: 1.1rem;
    padding: 12px 28px; border-radius: 40px; z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .3s;
    box-shadow: 0 0 40px #ffd700aa;
  }
  .golden-alert.show { opacity: 1; }

  /* RIGHT PANEL */
  .shop {
    background: linear-gradient(180deg, #0a0a16 0%, #070710 100%);
    border-left: 1px solid rgba(0,240,255,.12);
    display: flex; flex-direction: column; overflow: hidden;
  }
  @media (max-width: 820px) {
    .shop { border-left: none; border-top: 1px solid rgba(0,240,255,.12); }
  }

  .shop-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .shop-header h2 {
    font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-btns { display: flex; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: .95rem;
    transition: all .15s;
  }
  .icon-btn:hover { background: rgba(0,240,255,.12); border-color: var(--accent); }

  .prestige-btn {
    background: linear-gradient(135deg, #ff2d95, #a855f7);
    border: none; color: #fff; font-family: 'Exo 2', sans-serif;
    font-size: .72rem; font-weight: 600; padding: 6px 11px; border-radius: 20px;
    cursor: pointer; transition: all .2s; opacity: .4; pointer-events: none;
  }
  .prestige-btn.active { opacity: 1; pointer-events: auto; box-shadow: 0 0 18px rgba(255,45,149,.4); }
  .prestige-btn.active:hover { transform: scale(1.05); }

  .shop-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,.05); }
  .tab {
    flex: 1; padding: 9px 4px; text-align: center; font-size: .78rem; font-weight: 500;
    cursor: pointer; color: var(--muted); transition: all .15s;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .shop-content { flex: 1; overflow-y: auto; padding: 8px; }
  .shop-content::-webkit-scrollbar { width: 5px; }
  .shop-content::-webkit-scrollbar-thumb { background: rgba(0,240,255,.2); border-radius: 3px; }

  .item {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    margin-bottom: 6px; background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.04); border-radius: 11px;
    cursor: pointer; transition: all .12s; position: relative;
  }
  .item:hover, .item.focused { background: rgba(0,240,255,.07); border-color: rgba(0,240,255,.25); }
  .item.focused { box-shadow: 0 0 0 2px var(--accent); }
  .item.cant-afford { opacity: .42; }
  .item.owned-upgrade { opacity: .5; pointer-events: none; }

  .item-icon {
    width: 40px; height: 40px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem; flex-shrink: 0; background: rgba(0,0,0,.25);
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: .9rem; margin-bottom: 1px; }
  .item-desc { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-stats { text-align: right; flex-shrink: 0; }
  .item-cost { font-family: 'Orbitron', monospace; font-size: .8rem; font-weight: 600; color: var(--gold); }
  .item-owned { font-size: .65rem; color: var(--muted); margin-top: 1px; }
  .item-owned span { color: var(--accent); }

  .ach-item {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    margin-bottom: 6px; background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.04); border-radius: 11px;
  }
  .ach-item.unlocked { border-color: rgba(0,255,157,.25); background: rgba(0,255,157,.05); }
  .ach-icon { font-size: 1.4rem; width: 36px; text-align: center; }
  .ach-info { flex: 1; }
  .ach-name { font-weight: 600; font-size: .88rem; }
  .ach-desc { font-size: .68rem; color: var(--muted); }
  .ach-reward { font-size: .7rem; color: var(--gold); margin-top: 2px; }

  .footer-info {
    padding: 8px 14px; border-top: 1px solid rgba(255,255,255,.05);
    font-size: .68rem; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .key { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: .62rem; }

  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 100;
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid rgba(0,240,255,.25);
    border-radius: 18px; padding: 28px; max-width: 400px; width: 92%;
    text-align: center; box-shadow: 0 0 50px rgba(0,240,255,.15);
  }
  .modal h2 {
    font-family: 'Orbitron', sans-serif; margin-bottom: 10px; font-size: 1.3rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .modal p { color: var(--muted); margin-bottom: 18px; line-height: 1.5; font-size: .92rem; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-btn {
    padding: 10px 22px; border-radius: 10px; border: none;
    font-family: 'Exo 2', sans-serif; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .modal-btn.confirm { background: linear-gradient(135deg, var(--accent2), var(--accent3)); color: #fff; }
  .modal-btn.cancel { background: rgba(255,255,255,.08); color: var(--text); }
  .modal-btn:hover { transform: scale(1.04); }
  .modal textarea {
    width: 100%; height: 90px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; color: var(--text); padding: 10px; font-size: .8rem; resize: none; margin-bottom: 12px;
  }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px);
    background: rgba(0,240,255,.12); border: 1px solid var(--accent); color: var(--accent);
    padding: 11px 22px; border-radius: 28px; font-weight: 600; z-index: 200;
    transition: transform .3s ease; backdrop-filter: blur(12px); font-size: .9rem;
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ach { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,.12); }

  .offline-popup {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(0,240,255,.18), rgba(168,85,247,.18));
    border: 1px solid var(--accent); padding: 12px 24px; border-radius: 14px;
    z-index: 50; text-align: center; animation: slideDown .45s ease; display: none;
  }
  .offline-popup.show { display: block; }
  @keyframes slideDown {
    from { transform: translateX(-50%) translateY(-80px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px;
  }
  .stat-box {
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
    border-radius: 10px; padding: 12px; text-align: center;
  }
  .stat-val { font-family: 'Orbitron', monospace; font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .stat-label { font-size: .7rem; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
  <div id="stars"></div>
  <canvas id="particles"></canvas>

  <div class="app">
    <div class="game-area">
      <div class="stats-top">
        <div class="energy-display" id="energy">0</div>
        <div class="cps-display">saniyede <span id="cps">0</span> enerji</div>
      </div>

      <div class="combo-bar" id="comboBar"><div class="combo-fill" id="comboFill"></div></div>
      <div class="combo-text" id="comboText">x1</div>

      <div class="star-container" id="starBtn">
        <div class="main-star" id="mainStar"></div>
        <div class="click-hint" id="clickHint">Tıkla / Space</div>
      </div>

      <div class="golden-alert" id="goldenAlert">⭐ ALTIN YILDIZ! ⭐</div>
    </div>

    <div class="shop">
      <div class="shop-header">
        <h2>KOZMİK</h2>
        <div class="header-btns">
          <button class="icon-btn" id="statsBtn" title="İstatistikler">📊</button>
          <button class="icon-btn" id="settingsBtn" title="Ayarlar">⚙️</button>
          <button class="prestige-btn" id="prestigeBtn">★ Yüksel</button>
        </div>
      </div>

      <div class="shop-tabs">
        <div class="tab active" data-tab="buildings">Binalar</div>
        <div class="tab" data-tab="upgrades">Yükselt</div>
        <div class="tab" data-tab="achievements">Başarım</div>
      </div>

      <div class="shop-content" id="shopContent"></div>

      <div class="footer-info">
        <div>
          <span class="key">↑↓</span> Seç
          <span class="key">Enter</span> Al
          <span class="key">Space</span> Tık
        </div>
        <div id="prestigeLevel">★ 0</div>
      </div>
    </div>
  </div>

  <!-- Prestige Modal -->
  <div class="modal-overlay" id="prestigeModal">
    <div class="modal">
      <h2>Yükseliş</h2>
      <p id="prestigeText"></p>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="prestigeCancel">Vazgeç</button>
        <button class="modal-btn confirm" id="prestigeConfirm">Yüksel!</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Ayarlar</h2>
      <p style="margin-bottom:14px">
        <label style="display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer">
          <input type="checkbox" id="soundToggle" checked style="width:18px;height:18px">
          Ses Efektleri
        </label>
      </p>
      <div class="modal-btns" style="margin-bottom:12px">
        <button class="modal-btn cancel" id="exportBtn">Kaydı Kopyala</button>
        <button class="modal-btn cancel" id="importBtn">Kayıt Yükle</button>
      </div>
      <textarea id="saveArea" placeholder="Kayıt kodu buraya..."></textarea>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="settingsClose">Kapat</button>
        <button class="modal-btn confirm" id="resetBtn" style="background:var(--danger)">Sıfırla</button>
      </div>
    </div>
  </div>

  <!-- Stats Modal -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal">
      <h2>İstatistikler</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="modal-btns" style="margin-top:18px">
        <button class="modal-btn cancel" id="statsClose">Kapat</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="offline-popup" id="offlinePopup"></div>

<script>
const SAVE_KEY = 'kozmik_tiklayici_v2';

const BUILDINGS = [

  { id: 'g3', name: 'Verimlilik III', icon: '🌌', cost: 5e5,    effect: 'global',value: 2,  desc: 'Tüm CPS x2',     req: { buildings: 50 } },
  { id: 'g4', name: 'Verimlilik IV',  icon: '✨', cost: 1e7,    effect: 'global',value: 3,  desc: 'Tüm CPS x3',     req: { buildings: 100 } },
  { id: 'crit1',name: 'Kritik Şans',  icon: '🎯', cost: 7500,   effect: 'crit',  value: 0.05,desc: '+%5 Kritik şans',req: { energy: 3000 } },
  { id: 'crit2',name: 'Kritik Güç',   icon: '💎', cost: 75000,  effect: 'critDmg',value: 1, desc: 'Kritik x2 ekstra',req: { energy: 30000 } },
  { id: 'combo',name: 'Kombo Ustası', icon: '🔥', cost: 15000,  effect: 'combo', value: 1,  desc: 'Kombo süresi +2sn',req: { energy: 8000 } },
  { id: 'b_cursor', name: 'Akıllı İmleç', icon: '🖱️', cost: 500, effect: 'building', building: 'cursor', value: 2, desc: 'İmleç x2', req: { cursor: 5 } },
  { id: 'b_drone',  name: 'Gelişmiş Drone',icon: '🛰️', cost: 2500,effect: 'building', building: 'drone', value: 2, desc: 'Drone x2', req: { drone: 5 } },
  { id: 'b_farm',   name: 'Süper Çiftlik', icon: '🌻', cost: 25000,effect:'building', building: 'farm', value: 2, desc: 'Çiftlik x2', req: { farm: 5 } },
  { id: 'b_mine',   name: 'Derin Maden',   icon: '🪨', cost: 3e5,  effect: 'building', building: 'mine', value: 2, desc: 'Maden x2', req: { mine: 5 } },
  { id: 'b_factory',name: 'Mega Fabrika',  icon: '🏗️', cost: 3e6,  effect: 'building', building: 'factory',value:2,desc: 'Fabrika x2',req: { factory: 5 } },
  { id: 'off1', name: 'Offline Güç', icon: '💤', cost: 10000, effect: 'offline', value: 0.25, desc: 'Offline +%25', req: { energy: 5000 } }
];

const ACHIEVEMENTS = [
  { id: 'a1', name: 'İlk Adım',       icon: '👣', desc: 'İlk tıklamanı yap',          check: s => s.totalClicks >= 1,     reward: 'click', value: 1.1 },
  { id: 'a2', name: 'Tıklayıcı',       icon: '👆', desc: '100 kez tıkla',               check: s => s.totalClicks >= 100,   reward: 'click', value: 1.15 },
  { id: 'a3', name: 'Tıklama Canavarı', icon: '🦖', desc: '1.000 kez tıkla',             check: s => s.totalClicks >= 1000,  reward: 'click', value: 1.2 },
  { id: 'a4', name: 'Enerji Toplayıcı', icon: '⚡', desc: '1.000 enerji biriktir',       check: s => s.totalEnergy >= 1000,  reward: 'global',value: 1.1 },
  { id: 'a5', name: 'Milyoner',        icon: '💰', desc: '1 milyon toplam enerji',      check: s => s.totalEnergy >= 1e6,   reward: 'global',value: 1.2 },
  { id: 'a6', name: 'Milyarder',       icon: '🏆', desc: '1 milyar toplam enerji',      check: s => s.totalEnergy >= 1e9,   reward: 'global',value: 1.3 },
  { id: 'a7', name: 'İlk Bina',        icon: '🏠', desc: 'İlk binanı satın al',         check: s => totalBuildings(s) >= 1, reward: 'global',value: 1.1 },
  { id: 'a8', name: 'İşletmeci',       icon: '🏢', desc: '25 bina sahip ol',            check: s => totalBuildings(s) >= 25,reward: 'global',value: 1.15 },
  { id: 'a9', name: 'İmparator',       icon: '👑', desc: '100 bina sahip ol',           check: s => totalBuildings(s) >= 100,reward:'global',value: 1.25 },
  { id: 'a10',name: 'Altın Avcısı',    icon: '⭐', desc: '5 Altın Yıldız yakala',       check: s => s.goldenCaught >= 5,    reward: 'click', value: 1.2 },
  { id: 'a11',name: 'Yükselen',        icon: '🌟', desc: 'İlk prestijini yap',          check: s => s.prestige >= 1,        reward: 'global',value: 1.2 },
  { id: 'a12',name: 'Efsane',          icon: '🌌', desc: '10 prestij puanı biriktir',   check: s => s.prestige >= 10,       reward: 'global',value: 1.5 }
];

let state = {
  energy: 0, totalEnergy: 0, totalClicks: 0,
  prestige: 0, prestigeMult: 1,
  lastSave: Date.now(),
  buildings: {}, upgrades: {}, achievements: {},
  goldenCaught: 0, critChance: 0, critMult: 2,
  comboTimeBonus: 0, offlineBonus: 0.5,
  sound: true, startTime: Date.now()
};

let clickPower = 1, globalCpsMult = 1, achClickMult = 1, achGlobalMult = 1;
let currentTab = 'buildings', focusedIndex = 0, focusedItems = [];
let combo = 0, comboTimer = 0, maxComboTime = 2.5;
let goldenActive = false, goldenTimer = 0, nextGolden = 45 + Math.random() * 60;
let audioCtx = null;

function totalBuildings(s) {
  return Object.values(s.buildings || {}).reduce((a, c) => a + c, 0);
}

// ==================== AUDIO ====================
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!state.sound) return;
  try {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
      o.frequency.setValueAtTime(400 + Math.random()*200, now);
      o.type = 'sine';
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.start(now); o.stop(now + 0.08);
    } else if (type === 'buy') {
      o.frequency.setValueAtTime(520, now);
      o.frequency.exponentialRampToValueAtTime(780, now + 0.12);
      o.type = 'triangle';
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.start(now); o.stop(now + 0.15);
    } else if (type === 'crit') {
      o.frequency.setValueAtTime(600, now);
      o.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
      o.type = 'square';
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      o.start(now); o.stop(now + 0.12);
    } else if (type === 'golden') {
      o.frequency.setValueAtTime(800, now);
      o.frequency.exponentialRampToValueAtTime(1400, now + 0.2);
      o.type = 'sine';
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      o.start(now); o.stop(now + 0.3);
    } else if (type === 'ach') {
      o.frequency.setValueAtTime(500, now);
      o.frequency.setValueAtTime(700, now + 0.1);
      o.frequency.setValueAtTime(900, now + 0.2);
      o.type = 'triangle';
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      o.start(now); o.stop(now + 0.35);
    }
  } catch(e) {}
}

// ==================== CORE ====================
function getBuildingCost(b) {
  return Math.floor(b.baseCost * Math.pow(1.15, state.buildings[b.id] || 0));
}
function getBuildingCps(b) {
  let cps = b.baseCps * (state.buildings[b.id] || 0);
  UPGRADES.filter(u => u.effect === 'building' && u.building === b.id && state.upgrades[u.id])
    .forEach(u => cps *= u.value);
  return cps;
}
function getTotalCps() {
  let t = 0;
  BUILDINGS.forEach(b => t += getBuildingCps(b));
  return t * globalCpsMult * achGlobalMult * state.prestigeMult;
}
function calcDerived() {
  clickPower = 1; globalCpsMult = 1;
  state.critChance = 0; state.critMult = 2; state.comboTimeBonus = 0; state.offlineBonus = 0.5;
  achClickMult = 1; achGlobalMult = 1;

  UPGRADES.forEach(u => {
    if (!state.upgrades[u.id]) return;
    if (u.effect === 'click') clickPower *= u.value;
    if (u.effect === 'global') globalCpsMult *= u.value;
    if (u.effect === 'crit') state.critChance += u.value;
    if (u.effect === 'critDmg') state.critMult += u.value;
    if (u.effect === 'combo') state.comboTimeBonus += u.value;
    if (u.effect === 'offline') state.offlineBonus += u.value;
  });
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id]) return;
    if (a.reward === 'click') achClickMult *= a.value;
    if (a.reward === 'global') achGlobalMult *= a.value;
  });
}

function handleClick(e) {
  // Combo
  comboTimer = maxComboTime + state.comboTimeBonus;
  combo = Math.min(combo + 1, 50);
  const comboMult = 1 + Math.floor(combo / 5) * 0.15;

  let isCrit = Math.random() < state.critChance;
  let gain = clickPower * achClickMult * state.prestigeMult * comboMult;
  if (isCrit) gain *= state.critMult;
  if (goldenActive) gain *= 7;

  state.energy += gain;
  state.totalEnergy += gain;
  state.totalClicks++;

  const btn = document.getElementById('starBtn');
  btn.classList.add('clicked');
  setTimeout(() => btn.classList.remove('clicked'), 70);

  const rect = btn.getBoundingClientRect();
  const x = (e && e.clientX) ? e.clientX : rect.left + rect.width / 2 + (Math.random()-0.5)*40;
  const y = (e && e.clientY) ? e.clientY : rect.top + rect.height / 2 + (Math.random()-0.5)*40;
  spawnFloat(x, y, '+' + formatNum(gain), isCrit);
  spawnParticles(x, y, isCrit || goldenActive);

  playSound(isCrit ? 'crit' : 'click');
  checkAchievements();
  updateUI();
}

function buyItem(item) {
  if (item.type === 'building') {
    const b = BUILDINGS.find(x => x.id === item.id);
    const cost = getBuildingCost(b);
    if (state.energy >= cost) {
      state.energy -= cost;
      state.buildings[b.id] = (state.buildings[b.id] || 0) + 1;
      playSound('buy');
      showToast(`${b.name} alındı!`);
      calcDerived();
      checkAchievements();
      renderShop();
      updateUI();
    }
  } else if (item.type === 'upgrade') {
    const u = UPGRADES.find(x => x.id === item.id);
    if (canBuyUpgrade(u)) {
      state.energy -= u.cost;
      state.upgrades[u.id] = true;
      playSound('buy');
      showToast(`${u.name} açıldı!`);
      calcDerived();
      renderShop();
      updateUI();
    }
  }
}

function canBuyUpgrade(u) {
  if (state.upgrades[u.id]) return false;
  if (state.energy < u.cost) return false;
  if (u.req.energy && state.totalEnergy < u.req.energy) return false;
  if (u.req.buildings && totalBuildings(state) < u.req.buildings) return false;
  for (const k of ['cursor','drone','farm','mine','factory']) {
    if (u.req[k] && (state.buildings[k] || 0) < u.req[k]) return false;
  }
  return true;
}
function isUpgradeVisible(u) {
  if (state.upgrades[u.id]) return false;
  if (u.req.energy && state.totalEnergy < u.req.energy * 0.25) return false;
  return true;
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = true;
      calcDerived();
      playSound('ach');
      showToast(`🏆 Başarım: ${a.name}`, true);
    }
  });
}

// ==================== GOLDEN STAR ====================
function spawnGolden() {
  goldenActive = true;
  goldenTimer = 13;
  document.getElementById('starBtn').classList.add('golden');
  document.getElementById('goldenAlert').classList.add('show');
  setTimeout(() => document.getElementById('goldenAlert').classList.remove('show'), 1800);
  playSound('golden');
  showToast('⭐ ALTİN YILDIZ! 7x güç, 13 saniye!');
}
function endGolden() {
  goldenActive = false;
  document.getElementById('starBtn').classList.remove('golden');
  state.goldenCaught++;
  checkAchievements();
}

// ==================== PRESTIGE ====================
function canPrestige() { return state.totalEnergy >= 1e6; }
function prestigeGain() { return Math.floor(Math.sqrt(state.totalEnergy / 1e6)); }

function doPrestige() {
  const gain = prestigeGain();
  state.prestige += gain;
  state.prestigeMult = 1 + state.prestige * 0.12;
  state.energy = 0;
  state.totalEnergy = 0;
  BUILDINGS.forEach(b => state.buildings[b.id] = 0);
  // Keep upgrades & achievements
  hideModal('prestigeModal');
  calcDerived();
  checkAchievements();
  renderShop();
  updateUI();
  showToast(`Yükseldin! +${gain} ★`);
  saveGame();
}

// ==================== RENDER ====================
function renderShop() {
  const box = document.getElementById('shopContent');
  box.innerHTML = '';
  focusedItems = [];

  if (currentTab === 'buildings') {
    BUILDINGS.forEach(b => {
      const cost = getBuildingCost(b);
      const owned = state.buildings[b.id] || 0;
      const can = state.energy >= cost;
      const el = document.createElement('div');
      el.className = 'item' + (can ? '' : ' cant-afford');
      const per = owned > 0 ? getBuildingCps(b) / owned : b.baseCps;
      el.innerHTML = `
        <div class="item-icon">${b.icon}</div>
        <div class="item-info">
          <div class="item-name">${b.name}</div>
          <div class="item-desc">${b.desc} • +${formatNum(per)}/sn</div>
        </div>
        <div class="item-stats">
          <div class="item-cost">${formatNum(cost)}</div>
          <div class="item-owned">sahip: <span>${owned}</span></div>
        </div>`;
      el.onclick = () => buyItem({ type: 'building', id: b.id });
      box.appendChild(el);
      focusedItems.push({ type: 'building', id: b.id, el });
    });
  } else if (currentTab === 'upgrades') {
    const list = UPGRADES.filter(isUpgradeVisible);
    list.forEach(u => {
      const can = canBuyUpgrade(u);
      const el = document.createElement('div');
      el.className = 'item' + (can ? '' : ' cant-afford');
      el.innerHTML = `
        <div class="item-icon">${u.icon}</div>
        <div class="item-info">
          <div class="item-name">${u.name}</div>
          <div class="item-desc">${u.desc}</div>
        </div>
        <div class="item-stats"><div class="item-cost">${formatNum(u.cost)}</div></div>`;
      el.onclick = () => buyItem({ type: 'upgrade', id: u.id });
      box.appendChild(el);
      focusedItems.push({ type: 'upgrade', id: u.id, el });
    });
    if (!list.length) box.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--muted);font-size:.88rem">Şu an alınacak yükseltme yok.<br>Daha fazla ilerle!</div>';
  } else {
    ACHIEVEMENTS.forEach(a => {
      const unlocked = !!state.achievements[a.id];
      const el = document.createElement('div');
      el.className = 'ach-item' + (unlocked ? ' unlocked' : '');
      el.innerHTML = `
        <div class="ach-icon">${unlocked ? a.icon : '🔒'}</div>
        <div class="ach-info">
          <div class="ach-name">${unlocked ? a.name : '???'}</div>
          <div class="ach-desc">${a.desc}</div>
          ${unlocked ? `<div class="ach-reward">Ödül: ${a.reward === 'click' ? 'Tıklama' : 'CPS'} x${a.value}</div>` : ''}
        </div>`;
      box.appendChild(el);
    });
  }
  highlightFocus();
}

function highlightFocus() {
  focusedItems.forEach((it, i) => it.el && it.el.classList.toggle('focused', i === focusedIndex));
  if (focusedItems[focusedIndex]?.el)
    focusedItems[focusedIndex].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function updateUI() {
  document.getElementById('energy').textContent = formatNum(state.energy);
  document.getElementById('cps').textContent = formatNum(getTotalCps());
  document.getElementById('prestigeLevel').textContent = '★ ' + state.prestige;

  const pBtn = document.getElementById('prestigeBtn');
  if (canPrestige()) {
    pBtn.classList.add('active');
    pBtn.textContent = `★ +${prestigeGain()}`;
  } else {
    pBtn.classList.remove('active');
    pBtn.textContent = '★ Yüksel';
  }

  // Combo UI
  const bar = document.getElementById('comboBar');
  const fill = document.getElementById('comboFill');
  const txt = document.getElementById('comboText');
  if (combo > 1 && comboTimer > 0) {
    bar.classList.add('active');
    txt.classList.add('active');
    fill.style.width = (comboTimer / (maxComboTime + state.comboTimeBonus) * 100) + '%';
    const cm = 1 + Math.floor(combo / 5) * 0.15;
    txt.textContent = `x${cm.toFixed(2)}  (${combo})`;
  } else {
    bar.classList.remove('active');
    txt.classList.remove('active');
  }

  // Live cost update for buildings
  if (currentTab === 'buildings') {
    document.querySelectorAll('.item').forEach((el, i) => {
      if (!BUILDINGS[i]) return;
      const cost = getBuildingCost(BUILDINGS[i]);
      el.classList.toggle('cant-afford', state.energy < cost);
      const c = el.querySelector('.item-cost');
      if (c) c.textContent = formatNum(cost);
    });
  }
}

function formatNum(n) {
  if (n < 0) return '0';
  if (n < 1000) return Math.floor(n).toLocaleString('tr-TR');
  const units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  let u = 0;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + units[u];
}

function spawnFloat(x, y, text, crit) {
  const el = document.createElement('div');
  el.className = 'float-text' + (crit ? ' crit' : '');
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = crit ? 'var(--gold)' : 'var(--accent)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function showToast(msg, isAch) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isAch ? ' ach' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function showOffline(gained, sec) {
  const el = document.getElementById('offlinePopup');
  const m = Math.floor(sec / 60);
  el.innerHTML = `Uzakken <strong>${formatNum(gained)}</strong> enerji kazandın!<br><small>${m > 0 ? m + ' dakika' : Math.floor(sec) + ' saniye'} offline</small>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5500);
}

// ==================== TICK ====================
function tick(dt) {
  // CPS
  const gain = getTotalCps() * dt;
  state.energy += gain;
  state.totalEnergy += gain;

  // Combo decay
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) { combo = 0; comboTimer = 0; }
  }

  // Golden star
  if (goldenActive) {
    goldenTimer -= dt;
    if (goldenTimer <= 0) endGolden();
  } else {
    nextGolden -= dt;
    if (nextGolden <= 0) {
      spawnGolden();
      nextGolden = 50 + Math.random() * 70;
    }
  }

  updateUI();
}

// ==================== SAVE ====================
function saveGame() {
  state.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      Object.assign(state, s);
      // ensure objects
      state.buildings = state.buildings || {};
      state.upgrades = state.upgrades || {};
      state.achievements = state.achievements || {};
    }
  } catch(e) {}
  BUILDINGS.forEach(b => { if (state.buildings[b.id] == null) state.buildings[b.id] = 0; });
}

// ==================== PARTICLES ====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
function spawnParticles(x, y, big) {
  const n = big ? 14 : 7;
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (big ? 11 : 7),
      vy: (Math.random() - 0.5) * (big ? 11 : 7) - 2,
      size: Math.random() * 3 + 1.5,
      life: 1,
      hue: big ? 40 + Math.random() * 30 : 180 + Math.random() * 50
    });
  }
}
function particleLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.022;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
    ctx.fill();
  });
  requestAnimationFrame(particleLoop);
}

// ==================== MODALS ====================
function showModal(id) { document.getElementById(id).classList.add('show'); }
function hideModal(id) { document.getElementById(id).classList.remove('show'); }

function showStats() {
  const playSec = (Date.now() - (state.startTime || Date.now())) / 1000;
  const hours = (playSec / 3600).toFixed(1);
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = [
    ['Toplam Enerji', formatNum(state.totalEnergy)],
    ['Toplam Tık', formatNum(state.totalClicks)],
    ['Mevcut CPS', formatNum(getTotalCps())],
    ['Prestij', state.prestige],
    ['Prestij Çarpanı', 'x' + state.prestigeMult.toFixed(2)],
    ['Altın Yıldız', state.goldenCaught],
    ['Bina Sayısı', totalBuildings(state)],
    ['Oynama Süresi', hours + ' saat']
  ].map(([l,v]) => `<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');
  showModal('statsModal');
}

// ==================== INIT ====================
function init() {
  // Stars bg
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 140; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2+.4}px;height:${Math.random()*2+.4}px;--dur:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    starsEl.appendChild(s);
  }

  loadGame();
  calcDerived();

  // Offline
  const offMs = Date.now() - state.lastSave;
  if (offMs > 15000) {
    const sec = Math.min(offMs / 1000, 86400 * 2);
    const gained = getTotalCps() * sec * state.offlineBonus;
    if (gained > 1) {
      state.energy += gained;
      state.totalEnergy += gained;
      showOffline(gained, sec);
    }
  }

  renderShop();
  updateUI();
  checkAchievements();

  // Events
  const starBtn = document.getElementById('starBtn');
  starBtn.addEventListener('click', handleClick);
  starBtn.addEventListener('touchstart', e => { e.preventDefault(); handleClick(e.touches[0]); }, { passive: false });

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      currentTab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      focusedIndex = 0;
      renderShop();
    });
  });

  document.getElementById('prestigeBtn').onclick = () => {
    if (!canPrestige()) return;
    document.getElementById('prestigeText').innerHTML =
      `Her şey sıfırlanacak (yükseltmeler ve başarımlar kalır).<br><br>
       <strong style="color:var(--gold)">+${prestigeGain()} Yıldız Puanı</strong><br>
       Her puan tüm üretimi <strong>+%12</strong> artırır.`;
    showModal('prestigeModal');
  };
  document.getElementById('prestigeCancel').onclick = () => hideModal('prestigeModal');
  document.getElementById('prestigeConfirm').onclick = doPrestige;

  document.getElementById('settingsBtn').onclick = () => {
    document.getElementById('soundToggle').checked = state.sound;
    document.getElementById('saveArea').value = '';
    showModal('settingsModal');
  };
  document.getElementById('settingsClose').onclick = () => hideModal('settingsModal');
  document.getElementById('soundToggle').onchange = e => { state.sound = e.target.checked; saveGame(); };
  document.getElementById('exportBtn').onclick = () => {
    document.getElementById('saveArea').value = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    showToast('Kayıt kopyalandı! Kutudaki kodu al.');
  };
  document.getElementById('importBtn').onclick = () => {
    try {
      const raw = document.getElementById('saveArea').value.trim();
      if (!raw) return;
      const s = JSON.parse(decodeURIComponent(escape(atob(raw))));
      Object.assign(state, s);
      calcDerived();
      renderShop();
      updateUI();
      saveGame();
      hideModal('settingsModal');
      showToast('Kayıt yüklendi!');
    } catch(e) { showToast('Geçersiz kayıt kodu'); }
  };
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Tüm ilerleme silinecek. Emin misin?')) {
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }
  };

  document.getElementById('statsBtn').onclick = showStats;
  document.getElementById('statsClose').onclick = () => hideModal('statsModal');

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); handleClick(); }
    if (e.code === 'ArrowUp') { e.preventDefault(); focusedIndex = Math.max(0, focusedIndex - 1); highlightFocus(); }
    if (e.code === 'ArrowDown') { e.preventDefault(); focusedIndex = Math.min(focusedItems.length - 1, focusedIndex + 1); highlightFocus(); }
    if (e.code === 'Enter') { e.preventDefault(); if (focusedItems[focusedIndex]) buyItem(focusedItems[focusedIndex]); }
  });

  // Loop
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    tick(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setInterval(saveGame, 4000);
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  particleLoop();

  // First interaction resume audio
  document.body.addEventListener('click', () => ensureAudio(), { once: true });
}

init();
</script>
</body>
</html>
